# S2 (#567): give the bot its OWN secrets, separate from the OpenClaw agent.
#
# The bot and the OpenClaw agent `dh-bot` both run on tei as `dh` and read the
# same .env.gpustack — which holds the OpenClaw agent's mail / calendar / SSH
# credentials the bot never needs. This drop-in makes the bot read ONLY its own
# secrets file:
#
#   * EnvironmentFile= (empty) clears any inherited file, then /etc/agentic_historian.env is
#     the only one systemd injects.
#   * AH_ENV_FILE makes config.py read ONLY /etc/agentic_historian.env for its file-sourced
#     secrets, so it never falls back to .env.gpustack even if that file is still
#     present and readable in the checkout.
#
# Install on tei (after filling /etc/agentic_historian.env from agentic_historian.env.example):
#   sudo cp deploy/systemd/agentic-historian.service.d/secrets.conf \
#       /etc/systemd/system/agentic-historian.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart agentic-historian
#
# Systemd confinement (item 2 of #567 — ProtectSystem=strict, NoNewPrivileges,
# narrow ReadWritePaths, …) is the separate `hardening.conf` drop-in; install
# both.
#
# Item 3 — a dedicated, less-privileged user. The real guarantee that the bot
# cannot read the OpenClaw credentials is OS permissions: run the bot as its own
# user that has no read access to the OpenClaw secret file. Create `agentic_historian` (NOT `dh-bot` — that is the OpenClaw
# agent's Discord identity), give
# it the checkout's data dir, make /etc/agentic_historian.env root:root 0600, and uncomment
# User=/Group= below. Until that user exists the bot keeps running as today and
# AH_ENV_FILE alone keeps it off .env.gpustack via config.py — a smaller but real
# step.

[Service]
EnvironmentFile=
EnvironmentFile=/etc/agentic_historian.env
Environment=AH_ENV_FILE=/etc/agentic_historian.env
# CHANGEME once the dedicated user exists (item 3):
# User=agentic_historian   # see user.conf — install that instead
# Group=agentic_historian
