# S2 item 3 (#567): the bot runs as its own user, `agentic_historian`.
#
# Today it runs as `dh`, the user the OpenClaw agent runs as — so each process
# can read the other's secrets, and no file mode helps while the reader owns the
# file. That is the whole of item 3, and it is the only one of the three items
# that reaches the Definition of Done: "the bot process cannot read the OpenClaw
# credentials".
#
# **Not named `dh-bot`.** That is the OpenClaw agent's Discord identity
# (SEPARATION.md, S1) — naming the bot's own user after the thing it is being
# separated from is how the two get confused again. The bot's name is
# `agentic_historian`, as decided on 17.10.2026; the unit keeps its existing
# name `agentic-historian.service`, because renaming a running unit is a
# separate step nobody asked for and `docs/DEPLOYMENT_TEI.md` records that the
# unit is called that.
#
# Install with `deploy/systemd/switch_to_own_user.sh`, which creates the user,
# moves the ownership listed there, installs this file and verifies with
# `check_separation.py`. Doing it by hand in the wrong order leaves a service
# that starts and cannot write — `ProtectSystem=strict` does not degrade
# gracefully.
#
# Verify afterwards:
#   systemctl show agentic-historian -pUser -pGroup
#   deploy/systemd/check_separation.py --openclaw-secrets <path>

[Service]
User=agentic_historian
Group=agentic_historian

# The data directories and the env file have to be readable and writable by this
# user, and the OpenClaw secrets must not be. `switch_to_own_user.sh` does that
# and prints what it changed; the matrix is in SEPARATION.md.
#
# Nothing else changes here. `ReadWritePaths` stays in hardening.conf: which
# paths are writable is a different question from who writes them, and keeping
# them in one file would mean re-reading a security unit to answer either.
