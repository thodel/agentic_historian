# SEC-9 (#580): sandbox the bot process the way the MCP server already is.
#
# The bot runs as `dh` and holds every secret in .env.gpustack at once — Discord
# token, GPUStack key, ATR gateway key, GitHub token (write on the outputs repo,
# branch/PR on the code repo), SwitchDrive app password, Nextcloud share password,
# HF token. The MCP server unit (deploy/mcp-atr/atr-mcp.service) is sandboxed with
# ProtectSystem=strict, NoNewPrivileges and a narrow ReadWritePaths; the bot had
# none of that, so a flaw in the bot could write anywhere `dh` can and escalate.
# This drop-in gives the bot the same confinement.
#
# Install on tei:
#   sudo cp deploy/systemd/agentic-historian.service.d/hardening.conf \
#       /etc/systemd/system/agentic-historian.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart agentic-historian
# Verify afterwards:  systemd-analyze security agentic-historian
#
# ── The writable paths, derived rather than guessed ──────────────────────────
#
# This file used to ship `ReadWritePaths=/srv/agentic_historian/.../data` as a
# CHANGEME example. On tei the checkout is under /home/dh, so installing it
# unedited makes `data/` read-only and every write fails on the first job. A
# placeholder that has to be corrected before it is safe is a step nobody takes
# — which is why item 2 of #567 stayed unimplemented while this file sat in the
# repo marked "✅ repo side".
#
# So get the list from the process itself, in the venv the unit runs:
#
#   /home/dh/agentic_historian/agentic_historian/.venv/bin/python \
#       /home/dh/agentic_historian/deploy/systemd/writable_paths.py
#
# The values below are that output for tei as measured on 2026-10-13. Re-run it
# after changing any *_DIR / *_ROOT setting, because ProtectSystem=strict does
# not degrade gracefully: a path that is missing is a write that fails.
#
# **One tier, decided on 17.10.2026.** `/update` used to run
# `git -C <checkout> pull` and `pip install`, so it needed the checkout and the
# virtualenv writable — permission to rewrite the code this very process runs.
# That is settled: `/update` keeps the **comparison** and loses the pull, so
# only the two data directories are writable and the deploy happens from
# outside.
#
# Not even `.git` is writable, and that is deliberate: it looks like the narrow
# option and is not, because `.git/hooks/*` runs as the service user on the next
# git operation. So the bot cannot `git fetch` either — `updater.remote_status`
# asks the remote with `git ls-remote` and writes nothing. The price is in the
# answer: without the objects locally, "behind" and "diverged" are not told
# apart, and the command says so instead of choosing one.
#
# ProtectHome stays off. `read-only` is correct only when every writable path is
# outside the home dirs, and on tei the checkout is /home/dh/agentic_historian —
# with ProtectHome=read-only the data dirs below are unwritable whatever
# ReadWritePaths says. `ProtectHome=tmpfs` plus these paths would work, but it
# hides the rest of /home from a process that has no business there either way,
# so it is the better option only once the layout is settled.
#
# Verify after installing:  systemd-analyze security agentic-historian

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict

# The writable paths. KH_DIR is the one that surprises: hub.json lives
# under knowledge_hub/data, NOT under data/, so a unit listing only the latter
# leaves every knowledge-hub write failing (#393, #643).
ReadWritePaths=/home/dh/agentic_historian/agentic_historian/data
ReadWritePaths=/home/dh/agentic_historian/agentic_historian/knowledge_hub/data

# No entry for ATR_PAGE_CACHE_ARCHIVE either, although it is set on tei: the bot
# only reads that cold tier (tei-vm-sanity's cron writes it, as dh), reading is
# not what ProtectSystem=strict restricts, and on a CIFS mount with forceuid a
# chown to the bot user cannot succeed anyway (22.10.2026, writable_paths.py).
#
# No entry for the checkout or the venv. `writable_paths.py --update` still
# emits one, for whoever deploys from outside and wants to know what that needs;
# it does not belong in the unit that serves Discord.

# ProtectHome=read-only    # see the note above — breaks a /home checkout
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
