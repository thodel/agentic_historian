# SEC-9 (#580): sandbox the bot process the way the MCP server already is.
#
# The bot runs as `dh` and holds every secret in .env.gpustack at once — Discord
# token, GPUStack key, ATR gateway key, GitHub token (write on the outputs repo,
# branch/PR on the code repo), SwitchDrive app password, Nextcloud share password,
# HF token. The MCP server unit (deploy/mcp-atr/atr-mcp.service) is sandboxed with
# ProtectSystem=strict, NoNewPrivileges and a narrow ReadWritePaths; the bot had
# none of that, so a flaw in the bot could write anywhere `dh` can and escalate.
# This drop-in gives the bot the same confinement.
#
# Install on tei:
#   sudo cp deploy/systemd/agentic-historian.service.d/hardening.conf \
#       /etc/systemd/system/agentic-historian.service.d/
#   sudo systemctl daemon-reload && sudo systemctl restart agentic-historian
# Verify afterwards:  systemd-analyze security agentic-historian
#
# ── Set the writable paths below to the REAL checkout before installing. ─────
# ReadWritePaths must list every directory the bot writes — at least the package
# `data/` dir, plus the hot-folder and any outputs checkout it writes to. With
# ProtectSystem=strict everything else is read-only, so a missing path shows up
# immediately as a job failing on its first write (not as silent data loss).
#
# ProtectHome: `read-only` is correct only if the checkout and every writable path
# are OUTSIDE the home dirs. The bot runs as `dh`, so if the checkout lives under
# /home/dh, either set ProtectHome=tmpfs and keep the checkout in ReadWritePaths
# (as the MCP unit's comment explains) or drop ProtectHome — otherwise data/ is
# unwritable. Leave it commented until the real layout is confirmed.

[Service]
NoNewPrivileges=yes
PrivateTmp=yes
ProtectSystem=strict
# CHANGEME: the bot's writable dirs. Example for a /srv checkout; edit for tei.
ReadWritePaths=/srv/agentic_historian/agentic_historian/data
# ProtectHome=read-only    # see the note above before enabling on a /home checkout
ProtectKernelTunables=yes
ProtectControlGroups=yes
RestrictSUIDSGID=yes
LockPersonality=yes
