# nginx location block for the QLever SPARQL endpoint (KG-4, #330).
# Include inside the existing tei.dh.unibe.ch server block, then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Publication scope: public, read-only SELECT — approved by the project owner
# (T. Hodel) on 2026-07-30. See knowledge_hub/corpus_build.py for the full
# record of what that covers and why.

location /sparql/ {
    proxy_pass         http://127.0.0.1:7019/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;

    # Queries only. QLever's write endpoints require the access token, which is
    # never sent from here; blocking the other verbs keeps that explicit.
    limit_except GET POST OPTIONS { deny all; }

    # A runaway query must not hold a worker forever.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # Public read-only endpoint — allow browser-based SPARQL clients.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
}
