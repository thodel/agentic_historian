# QLever for the Bestandsgraph on idhefix (KG-4, #330; phase 2 of #325).
#
#   docker compose -f docker-compose.bestand.yml run --rm index   # index $QLEVER_DATA/parts/*.nt
#   docker compose -f docker-compose.bestand.yml up -d qlever     # serve $QLEVER_DATA/index/
#
# refresh_bestand.sh drives both; it sets QLEVER_DATA and the memory limits.
# The index is built into index.new/ and only then swapped for index/, so the
# served index is never half-written.
#
# The image is pinned. On 17.11.2026 `adfreiburg/qlever:latest` had renamed
# IndexBuilderMain/ServerMain to qlever-index/qlever-server, so the next pull
# would have broken the index step. To upgrade: pull the new image, index a
# copy of parts/ with it, query it, then set QLEVER_IMAGE or change the digest.
#
# Named graphs (#830): index_parts.sh puts a part with a sidecar
# `<part>.nt.graph` into the graph that file names (the Human Lineage layer,
# CC BY-SA 4.0); every other part into the default graph.
#
# Without the docker group (idhefix, 18.11.2026): QLEVER_ENGINE=podman runs
# the same image rootless — refresh_bestand.sh and systemd/qlever-bestand.service.
#
# QLEVER_ACCESS_TOKEN has no default on purpose. nginx on tei forwards GET and
# POST with their query strings, so a token anyone can read in this repository
# would reach QLever's admin commands from the public internet. It lives in
# ~/.config/qlever/env on idhefix (0600), generated once with
# `openssl rand -hex 24`, and is never proxied or printed.
services:
  index:
    image: ${QLEVER_IMAGE:-adfreiburg/qlever@sha256:7f26dc0ba0f2573144deb414f46a1d5501599dbe58313e4fb1968db30b1d6445}
    profiles: ["tools"]          # never started by `up`; run explicitly
    volumes:
      - ${QLEVER_DATA:?set QLEVER_DATA}:/data
      # the same script the Podman route runs (refresh_bestand.sh, QLEVER_ENGINE=podman)
      - ./index_parts.sh:/index_parts.sh:ro
    working_dir: /data
    environment:
      QLEVER_INDEX: ${QLEVER_INDEX:-ah-bestand}
    entrypoint: ["bash"]
    command: ["/index_parts.sh"]

  qlever:
    image: ${QLEVER_IMAGE:-adfreiburg/qlever@sha256:7f26dc0ba0f2573144deb414f46a1d5501599dbe58313e4fb1968db30b1d6445}
    restart: unless-stopped
    volumes:
      - ${QLEVER_DATA:?set QLEVER_DATA}:/data
    working_dir: /data
    environment:
      QLEVER_INDEX: ${QLEVER_INDEX:-ah-bestand}
      QLEVER_MEMORY: ${QLEVER_MEMORY:-16G}
      QLEVER_CACHE: ${QLEVER_CACHE:-8G}
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:?set QLEVER_ACCESS_TOKEN in ~/.config/qlever/env}
    # Loopback only: tei reaches it through the SSH tunnel, nothing else does.
    ports:
      - "127.0.0.1:7019:7019"
    entrypoint: ["bash", "-c"]
    command:
      - qlever-server -i index/$${QLEVER_INDEX} -p 7019 -m $${QLEVER_MEMORY} -c $${QLEVER_CACHE} -a "$${QLEVER_ACCESS_TOKEN}"
    healthcheck:
      test: ["CMD", "bash", "-c",
             "curl -sf 'http://localhost:7019/?query=SELECT%20*%20WHERE%20%7B%3Fs%20%3Fp%20%3Fo%7D%20LIMIT%201' > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
