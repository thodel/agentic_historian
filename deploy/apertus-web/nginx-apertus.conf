# nginx location blocks for the Apertus 1.5 test page.
# Install as /etc/nginx/snippets/apertus.conf and include it inside the
# tei.dh.unibe.ch server block (see README.md), then:
#     sudo nginx -t && sudo systemctl reload nginx

# The page uses relative URLs (api/ask), so it must be served with the slash.
location = /apertus {
    return 301 /apertus/;
}

location /apertus/ {
    # Trailing slash strips /apertus/: the app serves /, /api/status, /api/ask.
    proxy_pass         http://127.0.0.1:8310/;
    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Real-IP         $remote_addr;
    proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    # The password travels as HTTP Basic; forward it explicitly.
    proxy_set_header   Authorization     $http_authorization;

    # Images up to 25 MB, as the app accepts.
    client_max_body_size 30m;

    # A cold start of Apertus on idhefix takes ~6 min and the gateway allows it
    # 900 s; the app waits 1080 s for the answer. Below that, nginx would answer
    # 504 while the GPU still works.
    proxy_read_timeout 1200s;
    proxy_send_timeout 1200s;

    limit_except GET POST { deny all; }
}
