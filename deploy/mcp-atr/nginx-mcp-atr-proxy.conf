# Shared proxy settings for the ATR MCP endpoint. Install as
# /etc/nginx/snippets/mcp-atr-proxy.conf.

proxy_http_version 1.1;
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# The Authorization header is the whole of this endpoint's access control.
# nginx forwards it by default; setting it explicitly means a future edit to the
# block above cannot drop it by accident.
proxy_set_header   Authorization     $http_authorization;

# MCP's streamable HTTP holds a server-to-client SSE stream open. Buffering it
# would hold every event until the response ends, which for a stream is never:
# the session would appear to hang rather than fail.
proxy_buffering    off;
proxy_cache        off;
proxy_set_header   Connection        "";

# A batch runs for hours, but a *request* does not — these cover the open SSE
# stream, not the job, which is detached and survives the connection either way.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# Only what MCP uses. A method nobody needs is a method nobody has to reason about.
limit_except GET POST DELETE OPTIONS { deny all; }
