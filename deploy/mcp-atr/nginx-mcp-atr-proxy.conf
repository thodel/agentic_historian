# Shared proxy settings for the ATR MCP endpoint. Install as
# /etc/nginx/snippets/mcp-atr-proxy.conf.

proxy_http_version 1.1;

# The app validates this against its own public hostname (DNS-rebinding
# protection). Passing $host rather than the upstream's name is therefore not
# cosmetic: with the default, every request would come back 421.
proxy_set_header   Host              $host;
proxy_set_header   X-Real-IP         $remote_addr;
proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto $scheme;

# The Authorization header is this endpoint's access control. nginx forwards it
# by default; setting it explicitly means a future edit cannot drop it silently.
proxy_set_header   Authorization     $http_authorization;

# MCP's streamable HTTP holds a server-to-client SSE stream open. Buffering it
# would hold every event until the response ends, which for a stream is never:
# the session would appear to hang rather than fail.
proxy_buffering    off;
proxy_cache        off;
proxy_set_header   Connection        "";

# These cover the open SSE stream, not the job — a batch is detached and outlives
# the connection either way.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# What MCP and OAuth use between them. A method nobody needs is a method nobody
# has to reason about.
limit_except GET POST DELETE OPTIONS { deny all; }
