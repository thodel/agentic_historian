# nginx location blocks for the ATR operations MCP server.
# Include inside the tei.dh.unibe.ch server block, then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Scope: this endpoint STARTS JOBS on idhefix. Unlike /sparql/ next door it is
# not read-only and not public — it is an OAuth protected resource, and every
# request without a token gets a 401 carrying the discovery pointer. Nothing here
# weakens that; these blocks only carry the connection.
#
# ── Why four blocks and not one ──────────────────────────────────────────────
#
# The MCP OAuth flow is served from two different places in the URL space:
#
#   https://tei.dh.unibe.ch/mcp/atr/mcp          the MCP endpoint
#   https://tei.dh.unibe.ch/mcp/atr/authorize    | the authorization server,
#   https://tei.dh.unibe.ch/mcp/atr/token        | all under our own prefix
#   https://tei.dh.unibe.ch/mcp/atr/register     |
#   https://tei.dh.unibe.ch/mcp/atr/login        the password form
#   https://tei.dh.unibe.ch/.well-known/oauth-protected-resource/mcp/atr/mcp
#
# The last one is not under the prefix and cannot be moved: RFC 9728 §3.1 builds
# it by inserting /.well-known/oauth-protected-resource between the host and the
# resource path, so it lives at the host root whatever the server is mounted on.
# It therefore needs its own block, and must arrive at the app **unstripped**.
#
# Everything else is the mirror image: the app serves /mcp, /authorize, /token
# at its own root, so the /mcp/atr/ prefix has to be **stripped** on the way in.
# That is the whole reason one block cannot do both — proxy_pass with a trailing
# slash strips, without one preserves, and each half needs the other behaviour.

# 1 ── Everything under our prefix. The trailing slash on proxy_pass strips
#      /mcp/atr/, so /mcp/atr/authorize reaches the app as /authorize.
#      A prefix location, not an exact one: the OAuth endpoints are discovered
#      from metadata, and enumerating them here would mean editing nginx every
#      time the SDK adds one.
location /mcp/atr/ {
    proxy_pass http://127.0.0.1:8300/;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}

# 2 ── The same address without the trailing slash. Kept because it is what a
#      person types, and because it answered here before the OAuth rebuild.
location = /mcp/atr {
    proxy_pass http://127.0.0.1:8300/mcp;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}

# 3 ── RFC 9728 protected-resource metadata, at the host root. No URI on
#      proxy_pass, so the path arrives exactly as written — the app registered
#      the route under this full path, derived from its own resource identifier.
#      Exact match, so it cannot shadow anything else under /.well-known/.
location = /.well-known/oauth-protected-resource/mcp/atr/mcp {
    proxy_pass http://127.0.0.1:8300;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}

# 4 ── RFC 8414 authorization-server metadata in its *path-insertion* spelling.
#      The SDK publishes it under our prefix (block 1 already serves that), but
#      the MCP spec has clients try both forms, and a client that tries only this
#      one would otherwise fail discovery with nothing in the log to explain it.
location = /.well-known/oauth-authorization-server/mcp/atr {
    proxy_pass http://127.0.0.1:8300/.well-known/oauth-authorization-server;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}
