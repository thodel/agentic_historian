# nginx location block for the ATR operations MCP server.
# Include inside the existing tei.dh.unibe.ch server block, then:
#     sudo nginx -t && sudo systemctl reload nginx
#
# Scope: this endpoint STARTS JOBS on asterAIx. Unlike /sparql/ next door it is
# not read-only and not public — the application requires a bearer token on every
# request and answers 401 without one. Nothing here weakens that; the block only
# carries the connection.

# Exact matches, so they win over the `location /mcp/` prefixes serving the
# read-only corpus servers next door. nginx evaluates `=` before any prefix or
# regex location, so nothing about the federation changes.
#
# Three spellings for one endpoint. `/mcp/atr/mcp` is the house convention on
# this host — every federation server is published as `/mcp/<name>/mcp`
# (/mcp/eos/mcp, /mcp/hbls/mcp, /mcp/kf/mcp), so that is the URL anyone will
# reach for by analogy, and the one to register the connector with. The two
# shorter forms are kept because a 404 from a URL that "obviously should work"
# costs more to diagnose than three location blocks cost to maintain.
location = /mcp/atr/mcp {
    proxy_pass http://127.0.0.1:8300/mcp;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}

location = /mcp/atr {
    proxy_pass http://127.0.0.1:8300/mcp;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}

location = /mcp/atr/ {
    proxy_pass http://127.0.0.1:8300/mcp;
    include /etc/nginx/snippets/mcp-atr-proxy.conf;
}
