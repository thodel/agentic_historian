name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: "Smoke: install + import + pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install ALL dependencies (loguru, py-cord/discord, pytest, etc.)
      # so import smoke and pytest both pass.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # …and what the *deployment* installs, which is a different file. Only
      # requirements-dev.txt was ever installed here, so the two drifted twice in
      # one day: python-dotenv was missing from requirements.txt and CI stayed
      # green while nothing could start from it (#427), then mcp was missing from
      # requirements-dev.txt and CI went red on tests that pass everywhere else.
      # Installing both closes the gap in both directions. The dev pins come
      # first and satisfy these ranges, so this only adds what is absent.
      - name: Install runtime dependencies
        run: pip install -r agentic_historian/requirements.txt


      # Install editable BEFORE smoke test so that entity_agent.py's
      # import of passage_index resolves. The cd agentic_historian
      # in the smoke step is fine; site-packages still takes
      # precedence over the source tree for package-level imports.
      - name: Install package in editable mode
        run: pip install -e agentic_historian/

      # Smoke: import the top-level modules.  All modules live under
      # agentic_historian/ so we cd into it first.
      - name: Import smoke test
        run: |
          cd agentic_historian
          python -c "import bot, config, reporter, orchestrator; from agents import source_description, entity_agent; print('All imports OK')"

      # Run ALL offline tests — existing ones plus the new test_ah_*.py
      # regression tests that ship with the fix PRs (#96-#103).
      # pyproject.toml lives in agentic_historian/ so install from there.
      # python -m pytest ensures pytest uses the same Python that pip installed to.
      - name: Run pytest
        run: |
          python -m pytest agentic_historian/tests/ \
                  -v --tb=short

  deployment-imports:
    name: "Deployment: requirements.txt alone has to import what runs"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Three times in one day a deployment died on a module that was in
    # requirements-dev.txt and not in requirements.txt — python-dotenv, then
    # openai, then tenacity. CI installs both files (see the smoke job), which is
    # right for the tests and hides exactly this: the deployment installs only the
    # smaller one, and nothing ever exercised it.
    #
    # So this job builds what the deployment builds and starts what the deployment
    # starts. It does not run the tests; it only proves the imports resolve.

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ONLY the runtime requirements
        run: pip install -r agentic_historian/requirements.txt

      - name: The import chains a deployment actually starts
        working-directory: agentic_historian
        run: |
          python -c "import config; print('config ok')"

          # The batch runner, through the import that killed it on tei:
          # gateway_recogniser pulls agent_a.kraken_client, and agent_a/__init__
          # drags in the whole LLM stack behind it.
          python -c "
          import sys; sys.path.insert(0, '.')
          import atr_batch
          atr_batch.gateway_recogniser()
          print('batch ok')"

          # The MCP server, which is what a fresh venv on tei runs.
          ATR_MCP_PUBLIC_URL=https://example.org/mcp/atr \
          ATR_MCP_PASSWORD=$(python -c 'import secrets; print(secrets.token_urlsafe(24))') \
          python -c "
          import sys; sys.path.insert(0, '.')
          import mcp_atr.server as srv
          assert srv.app is not None
          print('mcp server ok')"
