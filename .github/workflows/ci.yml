name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: "Smoke: install + import + pytest"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install ALL dependencies (loguru, py-cord/discord, pytest, etc.)
      # so import smoke and pytest both pass.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # …and what the *deployment* installs, which is a different file. Only
      # requirements-dev.txt was ever installed here, so the two drifted twice in
      # one day: python-dotenv was missing from requirements.txt and CI stayed
      # green while nothing could start from it (#427), then mcp was missing from
      # requirements-dev.txt and CI went red on tests that pass everywhere else.
      # Installing both closes the gap in both directions. The dev pins come
      # first and satisfy these ranges, so this only adds what is absent.
      - name: Install runtime dependencies
        run: pip install -r agentic_historian/requirements.txt

      # Smoke: import the top-level modules.  All modules live under
      # agentic_historian/ so we cd into it first.
      - name: Import smoke test
        run: |
          cd agentic_historian
          python -c "import bot, config, reporter, orchestrator; from agents import source_description, entity_agent; print('All imports OK')"

      # Run ALL offline tests — existing ones plus the new test_ah_*.py
      # regression tests that ship with the fix PRs (#96-#103).
      # pyproject.toml lives in agentic_historian/ so install from there.
      # python -m pytest ensures pytest uses the same Python that pip installed to.
      - name: Run pytest
        run: |
          pip install -e agentic_historian/ --no-deps
          python -m pytest agentic_historian/tests/ \
                  -v --tb=short
